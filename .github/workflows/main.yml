name: Build Calculator APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Clean Android SDK
        run: |
          rm -rf $ANDROID_HOME/platforms/android-31
          rm -rf $ANDROID_HOME/platforms/android-32
          rm -rf $ANDROID_HOME/platforms/android-33
          rm -rf $ANDROID_HOME/platforms/android-34
          rm -rf $ANDROID_HOME/platforms/android-35
          rm -rf $ANDROID_HOME/platforms/android-36
          rm -rf $ANDROID_HOME/build-tools/31*
          rm -rf $ANDROID_HOME/build-tools/32*
          rm -rf $ANDROID_HOME/build-tools/33*
          rm -rf $ANDROID_HOME/build-tools/34*
          rm -rf $ANDROID_HOME/build-tools/35*
          rm -rf $ANDROID_HOME/build-tools/36*

      - name: Unzip source
        run: unzip SmsForwarder-calculator-launch-build.zip -d ./app-source

      - name: Build APK
        run: |
          cd ./app-source/SmsForwarder-2.2.0
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-launch-apk
          path: ./app-source/SmsForwarder-2.2.0/app/build/outputs/apk/debug/app-debug.apk
