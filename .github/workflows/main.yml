name: Build Apple Style Calculator APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Clean Android SDK
        run: |
          rm -rf $ANDROID_HOME/platforms/android-31
          rm -rf $ANDROID_HOME/platforms/android-32
          rm -rf $ANDROID_HOME/platforms/android-33
          rm -rf $ANDROID_HOME/platforms/android-34
          rm -rf $ANDROID_HOME/platforms/android-35
          rm -rf $ANDROID_HOME/platforms/android-36
          rm -rf $ANDROID_HOME/build-tools/31*
          rm -rf $ANDROID_HOME/build-tools/32*
          rm -rf $ANDROID_HOME/build-tools/33*
          rm -rf $ANDROID_HOME/build-tools/34*
          rm -rf $ANDROID_HOME/build-tools/35*
          rm -rf $ANDROID_HOME/build-tools/36*

      - name: Unzip source
        run: unzip -o SmsForwarder-calculator-apple-style-build.zip -d ./app-source

      # 关键步骤：自动在menu里添加3个隐藏id，解决R.id找不到报错
      - name: Fix missing menu id(to_clone/to_about/to_help)
        run: |
          cd ./app-source/SmsForwarder-2.2.0/app/src/main/res/menu
          # 追加三个不可见菜单项，生成对应R.id，界面不显示
          echo '
<item android:id="@+id/to_clone" android:visible="false"/>
<item android:id="@+id/to_about" android:visible="false"/>
<item android:id="@+id/to_help" android:visible="false"/>
' >> main_menu.xml

      - name: Create signing files
        run: |
          cd ./app-source/SmsForwarder-2.2.0
          mkdir -p keystore
          mkdir -p app/keystore
          keytool -genkeypair -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US"
          cp keystore/debug.keystore app/debug.keystore
          cp keystore/debug.keystore app/keystore/debug.keystore
          cp keystore/debug.keystore debug.keystore

      - name: Build APK
        run: |
          cd ./app-source/SmsForwarder-2.2.0
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-final-apk
          path: ./app-source/SmsForwarder-2.2.0/app/build/outputs/apk/debug/*.apk
