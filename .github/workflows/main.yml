name: Build SmsForwarder APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Show repository files
        run: |
          ls -la
          find . -maxdepth 2 -name "*.zip" -type f -print

      - name: Unzip source
        run: |
          rm -rf app-source
          mkdir -p app-source

          ZIP_FILE=$(find . -maxdepth 2 -name "SmsForwarder-entry-unified-source*.zip" -type f | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "没有找到 SmsForwarder-entry-unified-source*.zip"
            find . -maxdepth 2 -name "*.zip" -type f -print
            exit 1
          fi

          echo "找到源码包：$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d app-source
          find app-source -maxdepth 3 -type f -o -type d

      - name: Locate Gradle project
        run: |
          PROJECT_DIR=$(find app-source -name "gradlew" -type f -exec dirname {} \; | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "没有找到 gradlew"
            find app-source -maxdepth 4 -type f -o -type d
            exit 1
          fi

          echo "找到项目目录：$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Check project files
        run: |
          cd "$PROJECT_DIR"
          pwd
          ls -la
          ls -la app
          ls -la app/src/main
          echo "原始 app/build.gradle："
          sed -n '1,120p' app/build.gradle

      - name: Fix debug signing
        run: |
          cd "$PROJECT_DIR"

          mkdir -p keystore

          keytool -genkeypair \
            -v \
            -keystore keystore/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          text = p.read_text()

          old_debug = """debug {
                  keyAlias keyProps['keyAlias']
                  keyPassword keyProps['keyPassword']
                  storeFile keyProps['storeFile'] ? file(keyProps['storeFile']) : null
                  storePassword keyProps['storePassword']
              }"""

          new_debug = """debug {
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
                  storeFile file('../keystore/debug.keystore')
                  storePassword 'android'
              }"""

          if old_debug in text:
              text = text.replace(old_debug, new_debug)
          else:
              text = text.replace(
                  "debug {",
                  "debug {\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n            storeFile file('../keystore/debug.keystore')\n            storePassword 'android'",
                  1
              )

          p.write_text(text)
          print("修改后的 app/build.gradle：")
          print(p.read_text())
          PY

      - name: Grant execute permission for Gradle
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          BUILD_CODE=${PIPESTATUS[0]}

          echo "========== 关键错误开始 =========="
          grep -n -i -A 25 -B 10 "what went wrong\|error:\|failed\|cannot find symbol\|manifest merger failed\|compilation failed\|unsupported class file\|signingconfig\|storefile\|keystore" build.log || true
          echo "========== 关键错误结束 =========="

          exit $BUILD_CODE

      - name: Find APK
        if: always()
        run: |
          find "$PROJECT_DIR" -name "*.apk" -type f -print || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            **/build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-entry-unified-apk
          path: |
            **/build/outputs/apk/debug/*.apk
