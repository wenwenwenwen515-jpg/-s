name: Build SmsForwarder APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip source
        run: |
          rm -rf app-source
          unzip -o "SmsForwarder-entry-unified-source.zip" -d app-source
          ls -la app-source

      - name: Check project files
        run: |
          cd app-source
          ls -la
          ls -la app
          ls -la app/src/main

      - name: Grant execute permission for Gradle
        run: |
          cd app-source
          chmod +x gradlew

      - name: Build debug APK
        run: |
          cd app-source
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find app-source -name "*.apk" -type f -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-entry-unified-apk
          path: |
            app-source/app/build/outputs/apk/debug/*.apk
            app-source/**/build/outputs/apk/debug/*.apk
