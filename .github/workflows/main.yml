name: Build Calculator APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Clean Android SDK
        run: |
          rm -rf $ANDROID_HOME/platforms/android-31
          rm -rf $ANDROID_HOME/platforms/android-32
          rm -rf $ANDROID_HOME/platforms/android-33
          rm -rf $ANDROID_HOME/platforms/android-34
          rm -rf $ANDROID_HOME/platforms/android-35
          rm -rf $ANDROID_HOME/platforms/android-36
          rm -rf $ANDROID_HOME/build-tools/31*
          rm -rf $ANDROID_HOME/build-tools/32*
          rm -rf $ANDROID_HOME/build-tools/33*
          rm -rf $ANDROID_HOME/build-tools/34*
          rm -rf $ANDROID_HOME/build-tools/35*
          rm -rf $ANDROID_HOME/build-tools/36*

      - name: Unzip source
        run: unzip SmsForwarder-calculator-launch-build-fixed.zip -d ./app-source

      - name: Create debug keystore config
        run: |
          cd ./app-source/SmsForwarder-2.2.0
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > keystore/keystore.properties <<EOF
          keyAlias=androiddebugkey
          keyPassword=android
          storeFile=../keystore/debug.keystore
          storePassword=android
          EOF

      - name: Build APK
        run: |
          cd ./app-source/SmsForwarder-2.2.0
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-launch-apk
          path: ./app-source/SmsForwarder-2.2.0/app/build/outputs/apk/debug/*.apk
